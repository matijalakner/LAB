[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "equipment"
version = "1.2.0"
description = "Drivers and terminal control for the lab equipment: Thorlabs DC2200 LED driver and PM400 power meter, CoolLED pE-300, Canon EOS R10 and FLIR Blackfly S cameras; any light source can be paired with cameras and the power meter."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# The core (CLI, Thorlabs ramp logic) needs nothing beyond the standard library.
dependencies = []

[project.optional-dependencies]
# DC2200 / PM400 / LIV. Linux: pyvisa-py over libusb (pyusb). Windows: the VISA library
# installed with the Thorlabs software (NI-VISA); pyvisa-py stays as a fallback.
thorlabs = ["pyvisa>=1.12", "pyvisa-py>=0.6", "pyusb>=1.2; sys_platform != 'win32'"]
# CoolLED pE-300 (USB virtual serial port: /dev/ttyACM* or COM*)
coolled = ["pyserial>=3.5"]
# Canon EOS over USB (libgphoto2: Linux/macOS only, so nothing is installed on Windows)
canon = ["gphoto2>=2.5; sys_platform != 'win32'"]
# FLIR Blackfly S; also needs Spinnaker+PySpin or Aravis+PyGObject (not on PyPI, see README)
flir = ["numpy>=1.20", "opencv-python>=4.5", "pillow>=8.0"]
all = ["equipment[thorlabs,coolled,canon,flir]"]
test = ["pytest>=7"]

[project.scripts]
equipment = "equipment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
