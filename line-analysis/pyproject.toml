[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "line-analysis"
version = "1.0.0"
description = "Find thin vertical lines in the photos and videos taken with the 'equipment' package, measure their spacing, and relate it to the light-source ramp (DC2200 or pE-300) and the measured power."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.20",
    "pillow>=8.0",
    "opencv-python>=4.5",
    "matplotlib>=3.5",
    "pandas>=1.3",
    "scipy>=1.7",      # fast median filter; the analysis falls back to numpy without it
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
analysis = "line_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
